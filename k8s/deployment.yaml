
apiVersion: apps/v1
kind: Deployment
metadata:
  name: weather-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: weather-app
  template:
    metadata:
      labels:
        app: weather-app
    spec:
      imagePullSecrets:
        - name: ecr-registry-secret
      containers:
        - name: weather-app
          image: 658860694090.dkr.ecr.ap-south-1.amazonaws.com/image-regi:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          env:
            - name: OPENWEATHER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: weather-api-secret
                  key: OPENWEATHER_API_KEY
